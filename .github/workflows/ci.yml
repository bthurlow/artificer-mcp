name: CI

on:
  push:
    # release-please branches are included so that a HUMAN push to one runs
    # CI on it.
    #
    # This was originally added on a wrong diagnosis, corrected here for
    # whoever reads it next. The release PR shows `no checks reported` and
    # sits BLOCKED, which looks like the `pull_request` event never fired.
    # It does fire. The runs exist — they just sit at `action_required`,
    # GitHub's approval gate for workflow runs triggered by a bot, and runs
    # in that state publish no check contexts. Hence "no checks reported".
    #
    # So this trigger does NOT unblock the release PR: a release-please
    # push is also bot-initiated and gets gated the same way.
    #
    # DECISION (Brian, 2026-08-15): manual approval stays. Every release
    # PR needs a human to click "Approve and run" in the Actions tab (or
    # POST /actions/runs/{id}/approve) before its checks report. This is
    # deliberate — do not "fix" it by relaxing the repo's require-approval
    # setting or handing release-please a PAT. A human looking at what a
    # bot is about to run on main is the point.
    #
    # This trigger is kept anyway because a human push to a release branch
    # should run CI, and the coverage-badge steps are already gated to
    # refs/heads/main so it never republishes the badge.
    branches: [main, 'release-please--**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      # The extra_params check warns against this map, so a stale map would
      # describe a schema the specs no longer have — i.e. it would start
      # lying in exactly the direction the warning exists to prevent.
      - run: yarn catalog:keys:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:unit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - name: Coverage summary
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              console.log('Statements:', c.statements.pct + '%');
              console.log('Branches:  ', c.branches.pct + '%');
              console.log('Functions: ', c.functions.pct + '%');
              console.log('Lines:     ', c.lines.pct + '%');
            " >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          PCT=$(node -e "console.log(require('./coverage/coverage-summary.json').total.statements.pct)")
          if (( $(echo "$PCT >= 90" | bc -l) )); then COLOR="brightgreen";
          elif (( $(echo "$PCT >= 80" | bc -l) )); then COLOR="green";
          elif (( $(echo "$PCT >= 70" | bc -l) )); then COLOR="yellow";
          elif (( $(echo "$PCT >= 60" | bc -l) )); then COLOR="orange";
          else COLOR="red"; fi
          mkdir -p badges
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${PCT}%\",\"color\":\"${COLOR}\"}" > badges/coverage.json
      - name: Deploy coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          BADGE_JSON=$(cat badges/coverage.json)
          DEPLOY_DIR=$(mktemp -d)
          cd "$DEPLOY_DIR"
          git init
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/bthurlow/artificer-mcp.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Try to pull existing gh-pages
          if git fetch origin gh-pages 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            touch .nojekyll
            git add .nojekyll
          fi

          mkdir -p badges
          echo "$BADGE_JSON" > badges/coverage.json
          git add badges/coverage.json
          git diff --staged --quiet || {
            git commit -m "chore: update coverage badge"
            git push origin gh-pages
          }

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - name: Install ImageMagick v7
        # Ubuntu noble's apt `imagemagick` package is v6.9.x and does NOT
        # provide a `magick` CLI entry point. Our tools require v7+'s `magick`
        # command, so install the official static AppImage instead.
        #
        # Fontconfig + ghostscript are still needed as ImageMagick runtime
        # dependencies for certain operations (PDFs, type resolution).
        # Tests don't rely on host fonts — they use a bundled TTF in
        # tests/fixtures/fonts/.
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig ghostscript
          # Upstream moved the static binaries to the download. subdomain;
          # the bare imagemagick.org/archive path now 404s (wget exit 8).
          #
          # Retries because this is the only place ffmpeg- and
          # ImageMagick-backed code is ever actually exercised — a transient
          # fetch failure here reads as "integration tests broken" and
          # trains everyone to ignore a red integration job. Seen twice on
          # 2026-08-15: once a real URL rot, once a network blip (exit 4).
          wget -q --tries=3 --timeout=30 --retry-connrefused \
            -O /tmp/magick "https://download.imagemagick.org/archive/binaries/magick"
          chmod +x /tmp/magick
          sudo mv /tmp/magick /usr/local/bin/magick
          magick --version | head -1
      - name: Install FFmpeg (static binary)
        # BtbN GPL build — unlike johnvansickle's, this includes --enable-libfreetype
        # and --enable-libfontconfig, so the drawtext filter is available.
        #
        # Pinned to the n8.1 line. Was n7.1 until 2026-08-17, when BtbN
        # dropped that line from their rolling `latest` release and the asset
        # started 404ing (wget exit 8 — a server error, NOT the exit 4 a
        # network blip gives, so the retries above cannot help). Their
        # `latest` release only ever carries the two or three newest lines,
        # so this URL will rot again the same way when 8.1 ages out.
        #
        # NOTE: the repo's documented FFmpeg baseline is 6+ (hard floor 4.3
        # for xfade). CI now tests on 8.1, which is further from that
        # baseline than before — it cannot catch accidental use of an
        # 8.x-only feature that would break a user on 6.x. BtbN no longer
        # publishes 6.x or 7.x here, so fixing that needs a different source.
        run: |
          ASSET="ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz"
          if ! wget -q --tries=3 --timeout=30 --retry-connrefused \
            -O /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$ASSET"; then
            # Self-diagnosing: when BtbN retires a line, the only thing you
            # need is the list of assets they DO publish. Print it rather
            # than making the next person go find the release page.
            echo "::error::Could not fetch $ASSET — BtbN has likely retired this line. Available linux64-gpl assets:"
            curl -sf https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest \
              | grep -o '"name": *"ffmpeg-[^"]*linux64-gpl[^"]*"' | sed 's/.*: *"/  /;s/"$//' || true
            echo "::error::Pick a current asset above and update ASSET in .github/workflows/ci.yml."
            exit 1
          fi
          mkdir -p /tmp/ffmpeg-extract
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=2 --wildcards '*/bin/*'
          sudo mv /tmp/ffmpeg-extract/ffmpeg /usr/local/bin/ffmpeg
          sudo mv /tmp/ffmpeg-extract/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version | head -1
          ffprobe -version | head -1
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q ' drawtext ' && echo "drawtext filter: OK" || { echo "drawtext filter MISSING"; exit 1; }
      - run: yarn install --frozen-lockfile
      - run: yarn test:integration
